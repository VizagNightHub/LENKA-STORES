<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LENKA STORES | Timeless Luxury & Lifestyle</title>
  
  <meta name="description" content="Discover refined electronics, modern gadgets, and couture fashion at LENKA STORES by Lenka Ventures Pvt Ltd." />
  <meta property="og:title" content="LENKA STORES" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230B0D12'/%3E%3Ctext x='50' y='68' font-family='serif' font-size='52' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3ELS%3C/text%3E%3C/svg%3E" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet" />

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cormorant Garamond', 'serif'],
          },
          colors: {
            bronze: { 300: '#E2D4C3', 400: '#C5A880', 500: '#A88B63' },
            platinum: { 100: '#F5F5F7', 200: '#E5E5EA', 400: '#AEAEB2' },
            noir: { 950: '#0A0B0D', 900: '#111216', 850: '#16181E', 800: '#1D2027' }
          }
        }
      }
    }
  </script>

  <style>
    .glass-nav {
      background: rgba(10, 11, 13, 0.92);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .fine-border { border: 1px solid rgba(255, 255, 255, 0.08); }
    .fine-border-hover:hover { border-color: rgba(197, 168, 128, 0.4); }
  </style>
</head>

<body class="bg-noir-950 text-slate-300 font-sans antialiased selection:bg-platinum-200 selection:text-black min-h-screen flex flex-col justify-between">

  <div class="bg-noir-900 border-b border-white/5 text-slate-400 text-[10px] py-2 px-4 text-center tracking-[0.3em] uppercase">
    Lenka Stores by Lenka Ventures Pvt Ltd &bull; Curated Catalog Live
  </div>

  <header class="sticky top-0 z-40 glass-nav">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-24 flex items-center justify-between">
      
      <a href="#" class="flex items-center gap-3.5 group">
        <div class="w-12 h-12 rounded-xl bg-noir-850 fine-border p-1.5 flex items-center justify-center transition-all group-hover:border-bronze-400/60 shadow-lg">
          <svg viewBox="0 0 100 100" class="w-full h-full" fill="none">
            <rect x="2" y="2" width="96" height="96" rx="16" stroke="#C5A880" stroke-width="3" stroke-opacity="0.6"/>
            <path d="M28 26V72H52" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
            <path d="M72 34C72 29 66 26 56 26C45 26 44 33 44 38C44 54 72 46 72 61C72 68 64 74 52 74C40 74 36 67 36 62" stroke="#C5A880" stroke-width="7" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="font-serif text-2xl tracking-[0.16em] text-white font-medium">LENKA</span>
          <span class="text-[8.5px] uppercase tracking-[0.45em] text-slate-500 font-medium -mt-0.5">STORES</span>
        </div>
      </a>

      <div class="flex items-center gap-3">
        <button type="button" onclick="openProfileModal()" id="authNavBtn" class="flex items-center gap-2.5 px-4 py-2 rounded-lg bg-noir-900 hover:bg-noir-850 text-slate-300 fine-border fine-border-hover transition-all text-xs tracking-wider uppercase font-medium cursor-pointer">
          <div class="w-5 h-5 rounded-full bg-white/5 flex items-center justify-center text-[10px] text-slate-300">
            <i data-lucide="user" class="w-3 h-3"></i>
          </div>
          <span id="navProfileName" class="text-[11px] tracking-widest font-light">Client Account</span>
        </button>
      </div>

    </div>
  </header>

  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full space-y-12">
    
    <div class="text-center space-y-4 max-w-2xl mx-auto">
      <h1 class="text-4xl sm:text-6xl font-serif font-light tracking-tight text-white">
        Curated Masterpieces
      </h1>
      <p class="text-sm font-serif italic text-bronze-300 tracking-wide">
        High-fidelity audio, ultra-capacity power solutions, and modern apparel.
      </p>
    </div>

    <div class="flex items-center justify-center gap-2 flex-wrap pb-4">
      <button onclick="filterCategory('All')" class="cat-btn active px-4 py-2 rounded-lg text-xs uppercase tracking-wider font-medium fine-border bg-platinum-100 text-noir-950 transition-all">All Collections</button>
      <button onclick="filterCategory('Electronics')" class="cat-btn px-4 py-2 rounded-lg text-xs uppercase tracking-wider font-medium fine-border bg-noir-900 text-slate-400 hover:text-white transition-all">Earbuds</button>
      <button onclick="filterCategory('Power')" class="cat-btn px-4 py-2 rounded-lg text-xs uppercase tracking-wider font-medium fine-border bg-noir-900 text-slate-400 hover:text-white transition-all">Power Banks</button>
      <button onclick="filterCategory('MensFashion')" class="cat-btn px-4 py-2 rounded-lg text-xs uppercase tracking-wider font-medium fine-border bg-noir-900 text-slate-400 hover:text-white transition-all">Men's Apparel</button>
      <button onclick="filterCategory('WomensFashion')" class="cat-btn px-4 py-2 rounded-lg text-xs uppercase tracking-wider font-medium fine-border bg-noir-900 text-slate-400 hover:text-white transition-all">Women's Apparel</button>
    </div>

    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      </div>

  </main>

  <div id="profileModal" class="fixed inset-0 z-50 overflow-hidden hidden" aria-modal="true" role="dialog">
    <div class="fixed inset-0 bg-black/80 backdrop-blur-sm" onclick="closeProfileModal()"></div>
    <div class="fixed inset-y-0 right-0 max-w-full flex pl-4 sm:pl-10">
      <div class="w-screen max-w-md bg-noir-900 border-l border-white/10 p-6 sm:p-8 flex flex-col justify-between shadow-2xl overflow-y-auto relative z-10 text-slate-300">
        <div>
          <div class="flex items-center justify-between pb-5 border-b border-white/10">
            <h2 class="font-serif text-lg text-white font-medium">Client Account & Address</h2>
            <button onclick="closeProfileModal()" class="text-slate-500 hover:text-white p-2"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <div id="statusNotice" class="hidden my-4 p-3 rounded-lg text-xs tracking-wide"></div>

          <form id="profileForm" onsubmit="handleSaveProfile(event)" class="space-y-4 mt-6">
            <div>
              <label class="block text-[10px] font-medium text-slate-400 uppercase tracking-widest mb-1.5">Full Name</label>
              <input type="text" id="custName" placeholder="e.g. Lenka Vardhan Sai" required class="w-full bg-noir-950 border border-white/10 rounded-lg px-4 py-2.5 text-xs text-white focus:outline-none focus:border-slate-400" />
            </div>

            <div>
              <label class="block text-[10px] font-medium text-slate-400 uppercase tracking-widest mb-1.5">Mobile Number</label>
              <input type="tel" id="custPhone" placeholder="10-digit mobile number" maxlength="10" required class="w-full bg-noir-950 border border-white/10 rounded-lg px-4 py-2.5 text-xs text-white focus:outline-none focus:border-slate-400" />
            </div>

            <div class="pt-3 border-t border-white/10 space-y-3">
              <span class="text-[10px] font-medium text-slate-400 uppercase tracking-wider block">Shipping Address</span>
              <div>
                <label class="block text-[10px] text-slate-500 mb-1">Country</label>
                <input type="text" id="addrCountry" value="India" required class="w-full bg-noir-950 border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-[10px] text-slate-500 mb-1">State</label>
                  <input type="text" id="addrState" placeholder="Andhra Pradesh" required class="w-full bg-noir-950 border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none" />
                </div>
                <div>
                  <label class="block text-[10px] text-slate-500 mb-1">District / City</label>
                  <input type="text" id="addrDistrict" placeholder="Visakhapatnam" required class="w-full bg-noir-950 border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none" />
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-[10px] text-slate-500 mb-1">Door / Flat No.</label>
                  <input type="text" id="addrDoor" placeholder="D.No 12-34" required class="w-full bg-noir-950 border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none" />
                </div>
                <div>
                  <label class="block text-[10px] text-slate-500 mb-1">Street Name</label>
                  <input type="text" id="addrStreet" placeholder="Beach Road" required class="w-full bg-noir-950 border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none" />
                </div>
              </div>
              <div>
                <label class="block text-[10px] text-slate-500 mb-1">PIN Code</label>
                <input type="text" id="addrPin" placeholder="6-digit PIN" maxlength="6" required class="w-full bg-noir-950 border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none" />
              </div>
            </div>

            <div>
              <label class="block text-[10px] font-medium text-slate-400 uppercase tracking-widest mb-1.5">Payment Method</label>
              <select id="custPayment" class="w-full bg-noir-950 border border-white/10 rounded-lg px-3 py-2.5 text-xs text-white">
                <option value="UPI (Google Pay / PhonePe / Paytm)">UPI (Google Pay / PhonePe)</option>
                <option value="Cash on Delivery (COD)">Cash on Delivery (COD)</option>
              </select>
            </div>

            <button type="submit" class="w-full py-3 rounded-lg bg-platinum-100 text-noir-950 font-bold text-xs uppercase tracking-widest cursor-pointer">
              Save Shipping Details
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-noir-950 border-t border-white/5 py-8">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 space-y-2">
      <p class="font-serif text-slate-400 text-sm tracking-widest">LENKA STORES</p>
      <p>&copy; 2026 Lenka Ventures Pvt Ltd. All rights reserved.</p>
    </div>
  </footer>

  <script>
    lucide.createIcons();

    const firebaseConfig = {
      apiKey: "AIzaSyDSFo6lpBsyO5fXB06BzTbsuTQ80pJNtvM",
      authDomain: "lenka-stores.firebaseapp.com",
      projectId: "lenka-stores",
      storageBucket: "lenka-stores.firebasestorage.app",
      messagingSenderId: "41062494605",
      appId: "1:41062494605:web:56ffab077c1ed5d54ccdc4"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allProducts = [];
    let currentCategory = 'All';

    // Real-Time Live Sync from Admin Studio
    db.collection('products').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
      allProducts = [];
      snapshot.forEach(doc => allProducts.push({ id: doc.id, ...doc.data() }));
      renderProducts();
    });

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = 'cat-btn px-4 py-2 rounded-lg text-xs uppercase tracking-wider font-medium fine-border bg-noir-900 text-slate-400 hover:text-white transition-all';
      });
      event.target.className = 'cat-btn active px-4 py-2 rounded-lg text-xs uppercase tracking-wider font-medium fine-border bg-platinum-100 text-noir-950 transition-all';
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      const filtered = currentCategory === 'All' 
        ? allProducts 
        : allProducts.filter(p => p.category === currentCategory);

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-600 text-sm">No items currently available in this category.</div>`;
        return;
      }

      filtered.forEach(p => {
        const variantsHtml = (p.variants || []).map((v, i) => `
          <button type="button" onclick="selectVariant('${p.id}', '${v}')" class="var-btn-${p.id} text-[10px] px-2.5 py-1 rounded border border-white/10 ${i === 0 ? 'bg-white/20 text-white border-bronze-400' : 'bg-noir-900 text-slate-400'}">
            ${v}
          </button>
        `).join('');

        const card = document.createElement('div');
        card.className = 'bg-noir-900 fine-border rounded-2xl overflow-hidden shadow-2xl flex flex-col justify-between group hover:border-bronze-400/40 transition-all duration-300';
        card.innerHTML = `
          <div>
            <div class="relative h-64 overflow-hidden bg-noir-950">
              <img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
              <span class="absolute top-3 left-3 bg-noir-950/80 backdrop-blur-md text-bronze-300 text-[10px] font-bold px-2.5 py-1 rounded tracking-widest uppercase border border-white/10">
                ${p.badge || 'EXCLUSIVE'}
              </span>
            </div>
            <div class="p-6 space-y-3">
              <h3 class="font-serif text-lg text-white font-medium">${p.title}</h3>
              <p class="text-xs text-slate-400 font-light line-clamp-2">${p.description}</p>
              
              <div class="pt-2">
                <span class="text-[9px] uppercase tracking-widest text-slate-500 block mb-1.5">Color Options:</span>
                <div class="flex flex-wrap gap-1.5">
                  ${variantsHtml}
                </div>
              </div>
            </div>
          </div>

          <div class="p-6 pt-0 border-t border-white/5 flex items-center justify-between mt-4">
            <div>
              <span class="text-xs text-slate-500 line-through">₹${Number(p.originalPrice).toLocaleString('en-IN')}</span>
              <span class="text-lg font-serif font-bold text-white block">₹${Number(p.offerPrice).toLocaleString('en-IN')}</span>
            </div>
            <button onclick="openProfileModal()" class="px-5 py-2.5 bg-platinum-100 hover:bg-white text-noir-950 font-bold text-xs uppercase tracking-wider rounded-lg transition-all">
              Order Now
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
      lucide.createIcons();
    }

    function selectVariant(prodId, variant) {
      document.querySelectorAll(`.var-btn-${prodId}`).forEach(b => {
        b.className = `var-btn-${prodId} text-[10px] px-2.5 py-1 rounded border border-white/10 bg-noir-900 text-slate-400`;
        if (b.innerText.trim() === variant) {
          b.className = `var-btn-${prodId} text-[10px] px-2.5 py-1 rounded border border-bronze-400 bg-white/20 text-white`;
        }
      });
    }

    function openProfileModal() { document.getElementById('profileModal').classList.remove('hidden'); }
    function closeProfileModal() { document.getElementById('profileModal').classList.add('hidden'); }

    function handleSaveProfile(e) {
      e.preventDefault();
      const phone = document.getElementById('custPhone').value.trim();
      const profile = {
        name: document.getElementById('custName').value.trim(),
        phone: phone,
        address: {
          country: document.getElementById('addrCountry').value,
          state: document.getElementById('addrState').value,
          district: document.getElementById('addrDistrict').value,
          door: document.getElementById('addrDoor').value,
          street: document.getElementById('addrStreet').value,
          pin: document.getElementById('addrPin').value
        },
        payment: document.getElementById('custPayment').value,
        updatedAt: new Date().toISOString()
      };
      db.collection('customers').doc(phone).set(profile, { merge: true }).then(() => {
        alert('Shipping details saved successfully!');
        closeProfileModal();
      });
    }
  </script>
</body>
</html>
