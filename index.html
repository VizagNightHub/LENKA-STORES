<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LENKA STORES | Timeless Luxury & Lifestyle</title>
  
  <meta name="description" content="Discover refined electronics, modern gadgets, and couture fashion at LENKA STORES by Lenka Ventures Pvt Ltd." />
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230B0D12'/%3E%3Ctext x='50' y='68' font-family='serif' font-size='52' font-weight='bold' fill='%23C5A880' text-anchor='middle'%3ELS%3C/text%3E%3C/svg%3E" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="css/styles.css" />

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cormorant Garamond', 'serif'],
          },
          colors: {
            bronze: { 300: '#E2D4C3', 400: '#C5A880', 500: '#A88B63' },
            platinum: { 100: '#F5F5F7', 200: '#E5E5EA', 400: '#AEAEB2' },
            noir: { 950: '#0A0B0D', 900: '#111216', 850: '#16181E', 800: '#1D2027' }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-noir-950 text-slate-300 font-sans antialiased selection:bg-bronze-400 selection:text-noir-950 min-h-screen flex flex-col">

  <div id="navbar-container"></div>
  <div id="hero-container"></div>
  <div id="catalog-container"></div>
  <div id="footer-container"></div>
  <div id="modals-container"></div>

  <script src="js/config.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/feedback.js"></script>

  <script>
    async function loadComponent(elementId, filePath) {
      try {
        const response = await fetch(filePath);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.text();
        const container = document.getElementById(elementId);
        if (container) container.innerHTML = data;
      } catch (err) {
        console.warn(`Error loading component ${filePath}:`, err);
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      // 1. Wait for HTML components to inject into DOM first
      await Promise.all([
        loadComponent('navbar-container', 'components/navbar.html'),
        loadComponent('hero-container', 'components/hero.html'),
        loadComponent('catalog-container', 'components/catalog.html'),
        loadComponent('footer-container', 'components/footer.html'),
        loadComponent('modals-container', 'components/modals.html')
      ]);

      // 2. Initialize UI, saved profiles, and Cart
      if (window.lucide) lucide.createIcons();
      updateCartUI();
      checkSavedProfile();

      // 3. Connect real-time catalog sync to the injected catalog container
      initCatalogSync();
    });
  </script>
</body>
</html>
