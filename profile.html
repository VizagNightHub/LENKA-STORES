<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LENKA STORES // Profile Hub</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            noir: '#07080A',
            surface: '#111318',
            neonGold: '#E8C997',
            mutedText: '#94A3B8'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#07080A] text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-[#E8C997] selection:text-black">

  <!-- GEN-Z TOP BAR -->
  <header class="px-6 sm:px-12 py-5 border-b border-white/10 flex items-center justify-between bg-[#111318]/80 backdrop-blur-md sticky top-0 z-30">
    <div class="flex items-center gap-4" id="profile-display-section">
      <div class="relative">
        <img id="profile-avatar-preview" class="w-13 h-13 rounded-2xl object-cover border-2 border-[#E8C997]/40 shadow-[0_0_20px_rgba(232,201,151,0.15)]" src="default-avatar.png" alt="Profile" />
        <span class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-emerald-500 border-2 border-[#111318]" title="Active Session"></span>
      </div>
      <div>
        <h3 id="display-username" class="font-bold text-white text-base tracking-tight">V. Udayteja</h3>
        <p id="display-address" class="text-xs text-[#94A3B8] flex items-center gap-1.5 mt-0.5"><i class="fa-solid fa-location-dot text-[#E8C997]"></i> Add your delivery address</p>
      </div>
    </div>
    
    <div class="flex items-center gap-3">
      <button type="button" id="auth-toggle-btn" class="px-4 py-2 rounded-xl bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-red-400 font-bold text-xs uppercase tracking-wider flex items-center gap-2 transition-all cursor-pointer shadow-lg">
        <i data-lucide="log-out" class="w-4 h-4"></i>
        <span id="auth-btn-text">Logout</span>
      </button>
      <a href="index.html" class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white transition-colors">
        <i data-lucide="x" class="w-5 h-5"></i>
      </a>
    </div>
  </header>

  <!-- QUICK ACTION PILLS -->
  <div class="px-6 sm:px-12 py-4 border-b border-white/5 bg-[#0A0B0E] flex items-center gap-3 overflow-x-auto custom-scrollbar">
    <button type="button" id="edit-profile-btn" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white font-bold text-xs tracking-wide flex items-center gap-2 transition-all cursor-pointer shadow-sm shrink-0">
      <i data-lucide="edit-3" class="w-3.5 h-3.5 text-[#E8C997]"></i>
      <span>Edit Profile & Address</span>
    </button>
  </div>

  <!-- MAIN CONTAINER -->
  <main class="p-6 sm:p-12 max-w-3xl mx-auto w-full flex-1">
    
    <!-- GEN-Z EDIT FORM (HIDDEN BY DEFAULT, TOGGLED SMOOTHLY) -->
    <div id="profile-edit-section" class="hidden flex-col space-y-6 bg-[#111318] p-6 sm:p-8 rounded-3xl border border-white/10 shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
      <div class="flex items-center justify-between border-b border-white/10 pb-4">
        <div>
          <span class="text-[10px] uppercase font-bold tracking-[0.2em] text-[#E8C997]">ACCOUNT SETTINGS</span>
          <h4 class="text-lg font-bold text-white tracking-tight">Edit Profile</h4>
        </div>
        <button type="button" id="cancel-edit-btn" class="p-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white transition-colors cursor-pointer">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      
      <form id="edit-profile-form" class="space-y-4 text-xs">
        <div>
          <label class="text-[10px] font-bold uppercase tracking-wider text-[#94A3B8] block mb-1">USERNAME / ALIAS</label>
          <input type="text" id="input-username" required class="w-full bg-[#0A0B0E] border border-white/15 rounded-2xl p-3.5 text-xs text-white focus:outline-none focus:border-[#E8C997] transition-all" />
        </div>
        
        <div>
          <label class="text-[10px] font-bold uppercase tracking-wider text-[#94A3B8] block mb-1">SHIPPING ADDRESS</label>
          <textarea id="input-address" rows="3" required class="w-full bg-[#0A0B0E] border border-white/15 rounded-2xl p-3.5 text-xs text-white focus:outline-none focus:border-[#E8C997] transition-all"></textarea>
        </div>

        <div>
          <label class="text-[10px] font-bold uppercase tracking-wider text-[#94A3B8] block mb-1">AVATAR IMAGE</label>
          <input type="file" id="photo-file-input" accept="image/*" class="hidden" />
          <label for="photo-file-input" id="file-label" class="block w-full bg-[#0A0B0E] border border-dashed border-white/20 rounded-2xl p-4 text-center text-xs text-slate-400 cursor-pointer hover:border-[#E8C997] transition-all">Choose Image File</label>
          <img id="live-file-preview" class="w-16 h-16 rounded-2xl object-cover mt-3 hidden border border-[#E8C997]/50 shadow-md" alt="Preview" />
        </div>

        <div class="flex gap-3 pt-2">
          <button type="submit" class="flex-1 py-4 bg-gradient-to-r from-[#C5A880] via-[#E8C997] to-[#C5A880] text-black font-extrabold text-xs uppercase tracking-widest rounded-2xl shadow-xl hover:brightness-110 transition-all cursor-pointer">Save Changes</button>
        </div>
      </form>
    </div>

    <!-- WELCOME CARD PLACEHOLDER -->
    <div id="profile-welcome-card" class="bg-[#111318] border border-white/10 rounded-3xl p-8 text-center space-y-4 shadow-xl">
      <div class="w-12 h-12 rounded-2xl bg-[#E8C997]/10 border border-[#E8C997]/30 text-[#E8C997] flex items-center justify-center mx-auto">
        <i data-lucide="shield-check" class="w-6 h-6"></i>
      </div>
      <h3 class="text-lg font-bold text-white">Atelier Member Session Active</h3>
      <p class="text-xs text-[#94A3B8] max-w-sm mx-auto">Your credentials and delivery destination are securely synced with Lenka Stores.</p>
    </div>

  </main>

  <script src="js/config.js"></script>
  <script src="js/profile.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
